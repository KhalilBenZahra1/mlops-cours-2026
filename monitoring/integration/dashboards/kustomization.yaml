# Intégration isolée, hors production et hors Applications Argo CD.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
configMapGenerator:
- name: scoring-integration-dashboards
  files:
  - scoring-integration.json
  options:
    disableNameSuffixHash: true
    labels:
      grafana_dashboard: '1'
